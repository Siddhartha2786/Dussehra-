<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Dussehra Celebration</title>
    <!-- Using Google Fonts for a premium look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Teko:wght@500&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. General Setup & Theme --- */
        :root {
            --saffron: #FF9933;
            --gold: #FFD700;
            --maroon: #800000;
            --dark-bg: #100014;
            --whatsapp-green: #25D366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevents all scrolling */
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            color: white;
        }

        /* --- 2. Initial Landing Screen --- */
        #landing-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(-45deg, var(--maroon), var(--saffron), var(--dark-bg), var(--gold));
            background-size: 400% 400%;
            animation: background-gradient 15s ease infinite, zoom-effect 12s ease-in-out infinite;
            z-index: 1000;
            transition: opacity 1.5s ease-out;
            padding: 20px;
        }

        #landing-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .landing-text {
            font-size: clamp(2rem, 8vw, 4.5rem);
            font-weight: 600;
            text-shadow: 0 0 15px rgba(0,0,0,0.7);
        }

        .reveal-button {
            margin-top: 40px;
            padding: 15px 40px;
            font-size: clamp(1.1rem, 4vw, 1.6rem);
            font-weight: bold;
            color: white;
            background: transparent;
            border: 3px solid white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: button-glow 2.5s infinite alternate;
        }

        .reveal-button:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.1);
        }

        @keyframes background-gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes zoom-effect {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes button-glow {
            from { box-shadow: 0 0 10px var(--saffron), 0 0 20px var(--saffron); }
            to { box-shadow: 0 0 20px var(--gold), 0 0 30px var(--gold); }
        }

        /* --- 3. Main Celebration Page --- */
        #celebration-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(ellipse at 70% 90%, #30052a, var(--dark-bg) 60%);
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease-in, visibility 1.5s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 3vh 2vw;
        }

        #celebration-canvas.visible {
            opacity: 1;
            visibility: visible;
        }

        .headline {
            font-family: 'Teko', sans-serif;
            font-size: clamp(3.5rem, 15vw, 7rem);
            font-weight: 500;
            text-transform: uppercase;
            background: linear-gradient(45deg, var(--gold), var(--saffron));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.5));
        }

        .gif-container {
            position: relative;
            width: clamp(280px, 90vw, 400px);
            margin: 2vh 0;
            animation: pulse-gif 5s infinite ease-in-out;
        }

        .gif-container img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        @keyframes pulse-gif {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .greeting-message {
            font-size: clamp(1.1rem, 4vw, 1.8rem);
            text-align: center;
            padding: 12px 22px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255, 153, 51, 0.5);
            border-radius: 12px;
            margin: 2vh 0;
            position: relative;
            text-shadow: 0 0 5px black;
            box-shadow: inset 0 0 15px rgba(128, 0, 0, 0.6);
        }

        .name-highlight {
            font-weight: bold;
            display: inline-block;
            color: var(--gold); /* Static gold color, animation removed */
        }
        
        /* --- 4. Controls & Sharing --- */
        .controls-container {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
            width: clamp(280px, 90vw, 400px);
            /* MODIFICATION: Increased bottom padding to 100px to ensure the ad does not cover the buttons */
            padding-bottom: 100px; 
        }
        
        .input-group { display: flex; flex-direction: column; gap: 10px; }

        .neon-input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.4);
            border: 2px solid var(--saffron);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .neon-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 15px var(--gold);
        }

        .neon-input::placeholder { color: rgba(255, 255, 255, 0.6); }

        .gift-button {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 12px;
            font-size: 1.2rem;
            text-decoration: none;
            color: white;
            background-color: var(--maroon);
            border-radius: 12px;
            font-weight: bold;
            transition: transform 0.2s;
            animation: gift-bounce 2s infinite ease-in-out;
        }
        
        .gift-button:hover { transform: scale(1.05); }
        .gift-button .hand-icon { animation: point-down 1.5s infinite; }

        @keyframes gift-bounce {
            0%, 100% { box-shadow: 0 0 15px rgba(128,0,0,0.8); transform: translateY(0); }
            50% { box-shadow: 0 0 30px #ff4d4d; transform: translateY(-3px); }
        }
        
        @keyframes point-down {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(4px); }
        }

        .whatsapp-button {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background-color: var(--whatsapp-green);
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            transition: all 0.3s;
        }
        
        .whatsapp-button:hover {
            background-color: #128C7E;
            box-shadow: 0 0 20px var(--whatsapp-green);
            transform: scale(1.02);
        }
        
        .whatsapp-button svg { width: 24px; height: 24px; }

        /* --- 5. Celebration Effects Canvas --- */
        #effects-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        /* --- 6. Advertisement Container Style --- */
        #ad-container {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 468px; /* Ad width */
            z-index: 9999; /* Ensures it is on the top layer */
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Landing Screen -->
    <div id="landing-overlay">
        <h1 class="landing-text">Aapke liye khaas Dussehra sandesh intezaar kar raha hai</h1>
        <button class="reveal-button" id="reveal-btn">Click to Reveal</button>
    </div>

    <!-- Main Celebration Page -->
    <main id="celebration-canvas">
        <canvas id="effects-canvas"></canvas>

        <h1 class="headline">Happy Dussehra</h1>
        
        <div class="gif-container">
            <img src="Dussehra.gif" alt="Happy Dussehra GIF Animation">
        </div>

        <div class="greeting-message">
            <span id="name-display" class="name-highlight">Someone</span> ki taraf se: <span id="message-display">aapko Dussehra ki hardik shubhkamnayein</span>
        </div>
        
        <div class="controls-container">
            <div class="input-group">
                <input type="text" id="name-input" class="neon-input" placeholder="Enter your name (e.g., Ig - Siddhartha_78 )">
                <textarea id="message-input" class="neon-input" placeholder="Type your Dussehra message" rows="2"></textarea>
            </div>

            <!-- 🔥🔥 PASTE YOUR AMAZON AFFILIATE LINK BELOW 🔥🔥 -->
            <a href="YOUR_AFFILIATE_LINK" target="_blank" class="gift-button">
                <span class="hand-icon">👇</span>🎁 Special Dussehra Gifts 🎁
            </a>

            <a href="#" id="whatsapp-share-btn" class="whatsapp-button" target="_blank">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12.04 2.01A10.03 10.03 0 0 0 2.01 12.04a10.03 10.03 0 0 0 10.03 10.03 10.03 10.03 0 0 0 10.03-10.03c0-5.52-4.49-10.03-10.03-10.03zM17.43 14.71c-.2-.1-.58-.29-.67-.32s-.58.1-.84.32a2.38 2.38 0 0 1-1.03 1.25c-.14.07-.28.09-.42.04-.15-.05-.67-.25-1.28-.78-.9-1.02-1.48-2.27-1.53-2.42-.04-.15.28-.41.39-.51l.3-.32c.1-.1.07-.2.02-.3-.05-.1-.28-.67-.38-.94s-.2-.22-.28-.22h-.24c-.1 0-.24.1-.37.24-.13.13-.5.5-.5 1.22s.5 1.41.58 1.51c.08.1.99 1.58 2.42 2.27.36.17.65.28.87.35.48.17.9.14 1.24.09.39-.06.58-.24.67-.48.1-.24.1-.48.04-.53z"></path></svg>
                <span>Share on WhatsApp</span>
            </a>
        </div>
    </main>

    <!-- Audio Asset -->
    <audio id="background-music" src="Dussehra.mp3" loop></audio>

    <!-- Adsterra Ad Container -->
    <div id="ad-container">
        <script type="text/javascript">
            atOptions = {
                'key' : '8b009b6000d60a93fcdb99977dad0e86',
                'format' : 'iframe',
                'height' : 60,
                'width' : 468,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="//www.highperformanceformat.com/8b009b6000d60a93fcdb99977dad0e86/invoke.js"></script>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Element References ---
            const landingOverlay = document.getElementById('landing-overlay');
            const revealBtn = document.getElementById('reveal-btn');
            const mainCanvas = document.getElementById('celebration-canvas');
            const backgroundMusic = document.getElementById('background-music');
            const nameInput = document.getElementById('name-input');
            const messageInput = document.getElementById('message-input');
            const nameDisplay = document.getElementById('name-display');
            const messageDisplay = document.getElementById('message-display');
            const whatsappShareBtn = document.getElementById('whatsapp-share-btn');
            const effectsCanvas = document.getElementById('effects-canvas');
            const ctx = effectsCanvas.getContext('2d');

            // --- Default Values & State ---
            const DEFAULT_NAME = "Someone";
            const DEFAULT_MESSAGE = "aapko Dussehra ki hardik shubhkamnayein";
            let currentName = DEFAULT_NAME;
            let currentMessage = DEFAULT_MESSAGE;

            // --- 1. Initialize from URL Parameters ---
            const urlParams = new URLSearchParams(window.location.search);
            const initialName = urlParams.get('name');
            const initialMsg = urlParams.get('msg');
            
            if (initialName) currentName = initialName;
            if (initialMsg) currentMessage = initialMsg;

            function updateGreetingAndShareLink() {
                nameDisplay.textContent = currentName;
                messageDisplay.textContent = currentMessage;
                nameInput.value = (currentName === DEFAULT_NAME && initialName === null) ? '' : currentName;
                messageInput.value = (currentMessage === DEFAULT_MESSAGE && initialMsg === null) ? '' : currentMessage;
                
                const shareText = `${currentName} ki taraf se: ${currentMessage}`;
                const pageUrl = `${window.location.origin}${window.location.pathname}?name=${encodeURIComponent(currentName)}&msg=${encodeURIComponent(currentMessage)}`;
                whatsappShareBtn.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText + "\n\n" + pageUrl)}`;
            }

            // --- 2. Reveal Button Logic ---
            revealBtn.addEventListener('click', () => {
                landingOverlay.classList.add('hidden');
                setTimeout(() => {
                    landingOverlay.style.display = 'none';
                    mainCanvas.classList.add('visible');
                    backgroundMusic.play().catch(e => console.error("Audio playback failed:", e));
                    initializeAudioAnalyser();
                }, 1500);
            }, { once: true });

            // --- 3. Input Handling ---
            nameInput.addEventListener('input', (e) => {
                currentName = e.target.value.trim() || DEFAULT_NAME;
                updateGreetingAndShareLink();
            });

            messageInput.addEventListener('input', (e) => {
                currentMessage = e.target.value.trim() || DEFAULT_MESSAGE;
                updateGreetingAndShareLink();
            });

            // --- 4. Celebration Effects (Canvas & Audio) ---
            let particles = [];
            let lanterns = [];
            let audioContext, analyser, source, dataArray;
            let beatLevel = 0;
            const EMOJIS = ['🔥', '🪔', '🎆', '🎇', '🏹', '🌼', '🌺', '🌿'];

            function resizeCanvas() {
                effectsCanvas.width = window.innerWidth;
                effectsCanvas.height = window.innerHeight;
            }

            function createParticle(x, y, isFirework) {
                const angle = Math.random() * Math.PI * 2;
                const speed = isFirework ? (Math.random() * 5 + 2) : (Math.random() * 1.5 + 0.5);
                const life = isFirework ? Math.random() * 80 + 50 : Math.random() * 100 + 80;
                const color = `hsl(${Math.random() * 60}, 100%, 70%)`;
                
                if (Math.random() < 0.025) {
                    return { type: 'emoji', emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)], x, y, vx: (Math.random() - 0.5) * 0.5, vy: Math.random() * 1 + 0.5, life: 250, rotation: 0 };
                }
                return { type: 'spark', x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - (isFirework ? 0 : 2), life, maxLife: life, color, size: Math.random() * 2.5 + 1 };
            }

            function createLantern() {
                lanterns.push({
                    x: Math.random() * effectsCanvas.width,
                    y: effectsCanvas.height + 100,
                    size: Math.random() * 30 + 20,
                    speed: Math.random() * 0.4 + 0.2,
                    color: `hsla(${Math.random() * 20 + 25}, 100%, 60%, 0.7)`
                });
            }

            function animationLoop() {
                ctx.clearRect(0, 0, effectsCanvas.width, effectsCanvas.height);
                
                const gifRect = document.querySelector('.gif-container').getBoundingClientRect();
                if (Math.random() < 0.3) {
                     particles.push(createParticle(gifRect.left + Math.random() * gifRect.width, gifRect.top + gifRect.height, false));
                }
                if (beatLevel > 0.45 && Math.random() < beatLevel) {
                     for(let i = 0; i < 15; i++) {
                        particles.push(createParticle(Math.random() * effectsCanvas.width, Math.random() * effectsCanvas.height / 2, true));
                     }
                }

                particles.forEach((p, i) => {
                    p.x += p.vx; p.y += p.vy; p.life--;
                    if (p.life <= 0) particles.splice(i, 1);

                    ctx.globalAlpha = p.life / p.maxLife;
                    if (p.type === 'spark') {
                        ctx.fillStyle = p.color;
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                    } else if (p.type === 'emoji') {
                        ctx.save(); ctx.translate(p.x, p.y); p.rotation += 0.01; ctx.rotate(p.rotation);
                        ctx.font = '24px serif'; ctx.fillText(p.emoji, -12, 12); ctx.restore();
                    }
                });

                if (Math.random() < 0.015) createLantern();
                
                lanterns.forEach((l, i) => {
                    l.y -= l.speed;
                    if (l.y < -100) lanterns.splice(i, 1);
                    
                    ctx.globalAlpha = Math.random() * 0.3 + 0.6;
                    ctx.fillStyle = l.color;
                    ctx.filter = `blur(${l.size / 3}px)`;
                    ctx.beginPath(); ctx.arc(l.x, l.y, l.size, 0, Math.PI * 2); ctx.fill();
                    ctx.filter = 'none';
                });

                ctx.globalAlpha = 1.0;
                requestAnimationFrame(animationLoop);
            }
            
            function initializeAudioAnalyser() {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    source = audioContext.createMediaElementSource(backgroundMusic);
                    
                    source.connect(analyser);
                    analyser.connect(audioContext.destination);
                    
                    analyser.fftSize = 64;
                    const bufferLength = analyser.frequencyBinCount;
                    dataArray = new Uint8Array(bufferLength);
                }
                updateBeatLevel();
            }

            function updateBeatLevel() {
                if (analyser) {
                    analyser.getByteFrequencyData(dataArray);
                    let sum = dataArray.reduce((a, b) => a + b, 0);
                    beatLevel = (sum / dataArray.length) / 128;
                }
                requestAnimationFrame(updateBeatLevel);
            }

            // --- Final Setup ---
            window.addEventListener('resize', resizeCanvas);
            updateGreetingAndShareLink();
            resizeCanvas();
            animationLoop();
        });
    </script>
</body>
</html>
